[theme]
base = "light"
primaryColor = "#2457C5"
backgroundColor = "#F5F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#202630"
font = "Arial"
baseFontSize = 16
baseRadius = "0.25rem"
buttonRadius = "0.25rem"
borderColor = "#DDE1E7"
dataframeBorderColor = "#DDE1E7"
dataframeHeaderBackgroundColor = "#F1F3F6"
showWidgetBorder = true
chartCategoricalColors = ["#2457C5", "#6B7483"]

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 40

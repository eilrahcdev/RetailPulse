[theme]
base = "light"
primaryColor = "#2759FB"
backgroundColor = "#F5F7FD"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#070C27"
font = "Arial"
baseFontSize = 16
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
borderColor = "#DCE2F0"
dataframeBorderColor = "#DCE2F0"
dataframeHeaderBackgroundColor = "#EEF1F9"
showWidgetBorder = true
chartCategoricalColors = ["#2759FB", "#717B94"]

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 40
